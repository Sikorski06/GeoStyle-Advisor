apiVersion: apps/v1
kind: Deployment
metadata:
  name: geostyle-deployment
  labels:
    app: geostyle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: geostyle
  template:
    metadata:
      labels:
        app: geostyle
    spec:
      containers:
      - name: geostyle-container
        image: geostyle-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 15
          periodSeconds: 20